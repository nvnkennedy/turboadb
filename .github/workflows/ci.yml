name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# don't pile up runs when several commits/tags are pushed in quick succession
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (test extras)
        run: |
          # upgrade the build toolchain too — the setuptools that ships with
          # Python 3.8 is old; a fresh one avoids version-specific build quirks
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[test]"
      - name: Offline smoke script
        run: python tests/test_offline.py
      - name: Pytest
        run: python -m pytest tests/ -q

  gui:
    # The `test` job installs only [test], so PyQt5 is absent and every GUI test
    # module skips itself — roughly half the suite never ran in CI. This job
    # installs [all] and runs the SAME suite with a real (offscreen) Qt.
    name: gui tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Qt system libraries
        if: runner.os == 'Linux'
        # PyQt5's manylinux wheel still dlopen()s these at import time; without
        # them "import PyQt5.QtWidgets" fails and the tests would just skip again.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libfontconfig1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1
      - name: Install (all extras)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[all,test]"
      - name: Confirm PyQt5 really imports
        # A skipped GUI suite must fail the job, not pass quietly.
        run: python -c "import PyQt5.QtWidgets, PyQt5.QtSvg; print('PyQt5 ok')"
      - name: Pytest
        run: python -m pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Ruff
        run: ruff check .

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

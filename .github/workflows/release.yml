name: Release

# Build the Windows GUI exe and attach it (plus the wheel/sdist) to the GitHub
# Release when a v* tag is pushed. The wheel bundles the same exe, exactly like
# the one scripts/release.py uploads to PyPI (the PyPI upload stays manual).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    # A stuck step (an error dialog in the windowed exe) used to hold the
    # runner for GitHub's 6-hour limit.
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,test]" pyinstaller pillow build twine
      - name: Tag must match turboadb.__version__
        # A mismatched tag used to publish a release whose exe and wheel carried
        # a different version than the tag people download it by.
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $ver = (python -c "import turboadb; print(turboadb.__version__)").Trim()
          if ($tag -and $tag -ne $ver) {
            throw "tag $tag does not match turboadb.__version__ $ver"
          }
          Write-Host "version $ver"
      - name: Offline smoke script
        run: python tests/test_offline.py
      - name: Pytest
        run: python -m pytest tests/ -q
      - name: Build the one-file GUI exe
        run: python -m PyInstaller --clean --noconfirm turboadb-gui.spec
      - name: Self-test the built exe
        # scripts/gui_entry.py runs the pywinrm/NTLM self-test under this flag
        # and writes the verdict to ~/.turboadb/winrm-selftest.txt.
        shell: pwsh
        timeout-minutes: 10
        env:
          TURBOADB_SELFTEST: winrm
        run: |
          $exe = Get-ChildItem dist/TurboADB-*-win64.exe | Select-Object -First 1
          if (-not $exe) { throw "PyInstaller produced no dist/TurboADB-*-win64.exe" }
          # It is a windowed exe, so wait for it explicitly (never forever: an
          # error dialog would wait for a click) and read its report.
          $p = Start-Process -FilePath $exe.FullName -PassThru
          $null = $p.Handle  # keeps ExitCode available after the process ends
          if (-not $p.WaitForExit(300000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "the built exe did not finish its self-test within 5 minutes"
          }
          $report = Join-Path $env:USERPROFILE ".turboadb\winrm-selftest.txt"
          if (-not (Test-Path $report)) { throw "the exe wrote no self-test report" }
          Get-Content $report
          if ($p.ExitCode -ne 0 -or (Get-Content $report -Raw) -match 'PROBLEMS') {
            throw "the built exe failed its winrm self-test (exit $($p.ExitCode))"
          }
      - name: Bundle the exe into the package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force turboadb/bin | Out-Null
          $exe = Get-ChildItem dist/TurboADB-*-win64.exe | Select-Object -First 1
          Copy-Item $exe.FullName turboadb/bin/turboadb-gui.exe
      - name: Build wheel + sdist
        run: python -m build
      - name: Check the artifacts
        # Same gates as scripts/release.py: every wheel really carries the exe,
        # and the metadata is valid for PyPI.
        shell: pwsh
        run: |
          python -c "import importlib.util, pathlib, sys; spec = importlib.util.spec_from_file_location('rel', 'scripts/release.py'); m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m); bad = [w.name for w in pathlib.Path('dist').glob('*.whl') if not m.wheel_has_exe(w)]; sys.exit('wheels without the bundled exe: ' + ', '.join(bad) if bad else 0)"
          python -m twine check dist/*.whl dist/*.tar.gz
      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TurboADB-*-win64.exe
            dist/*.whl
            dist/*.tar.gz
          # A failed PyInstaller build must not publish a release with no exe.
          fail_on_unmatched_files: true

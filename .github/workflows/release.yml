name: Release

# Build the Windows GUI exe and attach it (plus the wheel/sdist) to the GitHub
# Release when a v* tag is pushed. The wheel bundles the same exe, exactly like
# the one scripts/release.py uploads to PyPI (the PyPI upload stays manual).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]" pyinstaller pillow build
      - name: Build the one-file GUI exe
        run: python -m PyInstaller --clean --noconfirm turboadb-gui.spec
      - name: Bundle the exe into the package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force turboadb/bin | Out-Null
          $exe = Get-ChildItem dist/TurboADB-*-win64.exe | Select-Object -First 1
          Copy-Item $exe.FullName turboadb/bin/turboadb-gui.exe
      - name: Build wheel + sdist
        run: python -m build
      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TurboADB-*-win64.exe
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: false
